<!DOCTYPE html>
<html>
<head>
  <title>Doggy AI Buddy – Side Panel</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
    }
    button {
      padding: 6px 12px;
      margin-right: 6px;
      cursor: pointer;
    }
    #result {
      white-space: pre-wrap;
      background: #f1f1f1;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h2>🐶 Doggy Panel</h2>

  <!-- API Key storage -->
  <label for="n8nKey">n8n API Key (Doggy’s leash 🦴)</label>
  <input id="n8nKey" type="password" placeholder="Enter your n8n API key" />
  <button id="saveKey">Save Key</button>

  <hr />

  <!-- Workflow test fetch -->
  <button id="fetch-btn">Fetch Workflow</button>
  <pre id="result">Click the button above to test the MCP adapter.</pre>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
