<!DOCTYPE html>
<html>
<head>
  <title>Doggy AI Buddy – Side Panel</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
    }
    button {
      padding: 6px 12px;
      margin-right: 6px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      background: #f1f1f1;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h2>🐶 Doggy Panel</h2>

  <!-- API Key storage -->
  <label for="n8nKey">n8n API Key (Doggy’s leash 🦴)</label>
  <input id="n8nKey" type="password" placeholder="Enter your n8n API key" />
  <button id="saveKey">Save Key</button>

  <hr />

  <!-- Debug Mode toggle -->
  <label>
    <input type="checkbox" id="debugToggle" />
    🐾 Debug Mode (include execution logs)
  </label>

  <hr />

  <!-- Workflow test fetch -->
  <button id="fetch-btn">Fetch Workflow</button>
  <pre id="result">Click the button above to test workflow fetch.</pre>

  <hr />

  <!-- Debug logs viewer -->
  <button id="fetch-logs-btn">Fetch Execution Logs</button>
  <pre id="logsResult">Click the button above to fetch the latest execution logs.</pre>

  <hr />

  <!-- Webhook health check -->
  <label for="webhookUrl">Webhook URL</label>
  <input id="webhookUrl" type="text" placeholder="Paste your webhook URL here" />
  <button id="check-webhook-btn">Check Webhook</button>
  <pre id="webhookResult">Webhook health check will appear here.</pre>

  <hr />

  <!-- 🔍 Node details fetch -->
  <label for="nodeName">Node Name</label>
  <input id="nodeName" type="text" placeholder="Enter node name..." />
  <button id="get-node-btn">Get Node Details</button>
  <pre id="nodeResult">Node details will appear here.</pre>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
